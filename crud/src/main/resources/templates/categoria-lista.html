<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Categorias</title>
</head>
<body>

<h1>Lista de Categorias</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Editar</th>
        <th>Excluir</th>
    </tr>

    <tr th:each="c : ${categorias}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.nome}"></td>
        <td><a th:href="@{/categoria/editar/{id}(id=${c.id})}">Editar</a></td>
        <td><a th:href="@{/categoria/deletar/{id}(id=${c.id})}">Excluir</a></td>
    </tr>
</table>

<br>
<a href="/categoria/formulario">Nova Categoria</a>

</body>
</html>
