<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Produtos</title>
</head>
<body>

<h1>Lista de Produtos</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Quantidade</th>
        <th>Categoria</th>
        <th>Editar</th>
        <th>Excluir</th>
    </tr>

    <tr th:each="p : ${produtos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nome}"></td>
        <td th:text="${p.descricao}"></td>
        <td th:text="${p.valor}"></td>
        <td th:text="${p.quantidade}"></td>
        <td th:text="${p.categoria.nome}"></td>
        <td><a th:href="@{/produto/editar/{id}(id=${p.id})}">Editar</a></td>
        <td><a th:href="@{/produto/deletar/{id}(id=${p.id})}">Excluir</a></td>
    </tr>
</table>

<br>
<a href="/produto/formulario">Novo Produto</a>

</body>
</html>
