<\!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container mt-4">

<h1 class="text-center mb-4">Lista de Produtos</h1>

<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Descricao</th>
            <th>Valor</th>
            <th>Quantidade</th>
            <th>Imagem</th>
            <th>Categoria</th>
            <th>Editar</th>
            <th>Excluir</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="p : ${produtos}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.descricao}"></td>
            <td th:text="${p.valor}"></td>
            <td th:text="${p.quantidade}"></td>
            <td><img th:src="${p.imagem}" style="width: 80px"></td>
            <td th:text="${p.categoria \!= null ? p.categoria.nome : 'Sem categoria'}"></td>
            <td>
                <a class="btn btn-warning btn-sm" th:href="@{/produto/editar/{id}(id=${p.id})}">Editar</a>
            </td>
            <td>
                <a class="btn btn-danger btn-sm" th:href="@{/produto/deletar/{id}(id=${p.id})}">Excluir</a>
            </td>
        </tr>
    </tbody>
</table>

<a class="btn btn-primary" href="/produto/formulario">Novo Produto</a>
<a class="btn btn-outline-secondary" href="/">Voltar</a>

</body>
</html>
