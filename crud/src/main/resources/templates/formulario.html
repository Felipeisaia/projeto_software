<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Produto</title>
</head>
<body>

<h1>Cadastro de Produto</h1>

<form th:action="@{/produto/salvar}" th:object="${produto}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Nome:</label><br>
    <input type="text" th:field="*{nome}" required><br><br>

    <label>Descrição:</label><br>
    <input type="text" th:field="*{descricao}"><br><br>

    <label>Valor:</label><br>
    <input type="number" step="0.01" th:field="*{valor}"><br><br>

    <label>Quantidade:</label><br>
    <input type="number" th:field="*{quantidade}"><br><br>

    <label>Imagem:</label><br>
    <input type="text" th:field="*{imagem}"><br><br>

    <label>Categoria:</label><br>
    <select th:field="*{categoria}">
        <option th:each="c : ${categorias}"
                th:value="${c.id}"
                th:text="${c.nome}">
        </option>
    </select><br><br>

    <button type="submit">Salvar</button>
</form>

<a href="/produto/listar">Voltar</a>

</body>
</html>
