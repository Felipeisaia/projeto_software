<\!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 class="mb-4">Cadastro de Produto</h1>

<form th:action="@{/produto/salvar}" th:object="${produto}" method="post">
    <input th:field="*{id}" type="hidden"/>

    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" th:field="*{nome}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Descricao</label>
        <input type="text" class="form-control" th:field="*{descricao}">
    </div>

    <div class="mb-3">
        <label class="form-label">Valor</label>
        <input type="number" step="0.01" class="form-control" th:field="*{valor}">
    </div>

    <div class="mb-3">
        <label class="form-label">Quantidade</label>
        <input type="number" class="form-control" th:field="*{quantidade}">
    </div>

    <div class="mb-3">
        <label class="form-label">Imagem (URL)</label>
        <input type="text" class="form-control" th:field="*{imagem}">
    </div>

    <div class="mb-3">
        <label class="form-label">Categoria</label>
        <select class="form-select" th:field="*{categoria}" required>
            <option value="">Selecione uma categoria</option>
            <option th:each="cat : ${categorias}"
                    th:value="${cat.id}"
                    th:text="${cat.nome}">
            </option>
        </select>
    </div>

    <input type="reset" class="btn btn-secondary" value="Limpar">
    <input type="submit" class="btn btn-primary" value="Salvar">
</form>

<br>
<a class="btn btn-outline-secondary" href="/produto/listar">Ver Produtos</a>
<a class="btn btn-outline-secondary" href="/">Voltar</a>

</body>
</html>
