<\!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 class="mb-4">Lista de Categorias</h1>

<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Editar</th>
            <th>Excluir</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td>
                <a class="btn btn-warning btn-sm" th:href="@{/categoria/editar/{id}(id=${c.id})}">Editar</a>
            </td>
            <td>
                <a class="btn btn-danger btn-sm" th:href="@{/categoria/deletar/{id}(id=${c.id})}">Excluir</a>
            </td>
        </tr>
    </tbody>
</table>

<a class="btn btn-primary" href="/categoria/formulario">Nova Categoria</a>
<a class="btn btn-outline-secondary" href="/">Voltar</a>

</body>
</html>
