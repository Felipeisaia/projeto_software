<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental MVP - Pacientes</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-tooth sidebar-icon"></i>
        <h2>Dental MVP</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i class="fas fa-chart-bar"></i>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item active">
          <i class="fas fa-users"></i>
          <span>Pacientes</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-calendar-alt"></i>
          <span>Agendamentos</span>
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header">
        <div class="header-left">
          <h1>Pacientes</h1>
          <h2>Gerenciamento de Pacientes</h2>
          <p>Gerencie seus pacientes e histórico médico</p>
        </div>
        <div class="header-right">
          <div class="user-avatar">F</div>
        </div>
      </div>

      <div class="content-section">
        <div class="action-bar">
          <button class="btn-primary" id="newPatientBtn">
            <i class="fas fa-plus"></i>
            Novo Paciente
          </button>
          <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar por nome, CPF ou email">
            <button id="searchBtn" class="btn-search">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </div>

        <div class="table-container">
          <table class="patients-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Email</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="patientList"></tbody>
          </table>
          <div id="paginationControls" class="pagination"></div>
        </div>
      </div>

      <!-- Modal for Patient Details -->
      <div id="patientModal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Detalhes do Paciente</h3>
            <span class="close">&times;</span>
          </div>
          <div id="patientDetail" class="modal-body"></div>
        </div>
      </div>

      <!-- Modal for New Patient -->
      <div id="newPatientModal" class="modal">
        <div class="modal-content large">
          <div class="modal-header">
            <h3>Cadastrar Novo Paciente</h3>
            <span class="close">&times;</span>
          </div>
          <div class="modal-body">
            <form id="createPatientForm">
              <div class="form-grid-create">
                <input type="text" id="createName" placeholder="Nome Completo *" required>
                <input type="tel" id="createPhone" placeholder="Telefone *" required>
                <input type="email" id="createEmail" placeholder="Email">
                <input type="text" id="createCpf" placeholder="CPF">
                <input type="date" id="createBirthDate" placeholder="Data de Nascimento">
                <input type="text" id="createAddress" placeholder="Endereço">
                <input type="text" id="createCity" placeholder="Cidade">
                <input type="text" id="createState" placeholder="Estado (UF)">
                <input type="text" id="createZipCode" placeholder="CEP">
                <input type="text" id="createEmergencyContact" placeholder="Contato de Emergência">
                <textarea id="createAllergies" placeholder="Alergias"></textarea>
                <textarea id="createMedications" placeholder="Medicamentos em Uso"></textarea>
                <textarea id="createNotes" placeholder="Observações"></textarea>
              </div>
              <button type="submit" class="btn-primary full-width">Cadastrar Paciente</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal for Edit Patient -->
      <div id="editPatientModal" class="modal">
        <div class="modal-content large">
          <div class="modal-header">
            <h3>Editar Paciente</h3>
            <span class="close">&times;</span>
          </div>
          <div class="modal-body">
            <form id="editPatientForm">
              <div class="form-grid-create">
                <input type="text" id="editName" placeholder="Nome Completo *" required>
                <input type="tel" id="editPhone" placeholder="Telefone *" required>
                <input type="email" id="editEmail" placeholder="Email">
                <input type="text" id="editCpf" placeholder="CPF">
                <input type="date" id="editBirthDate" placeholder="Data de Nascimento">
                <input type="text" id="editAddress" placeholder="Endereço">
                <input type="text" id="editCity" placeholder="Cidade">
                <input type="text" id="editState" placeholder="Estado (UF)">
                <input type="text" id="editZipCode" placeholder="CEP">
                <input type="text" id="editEmergencyContact" placeholder="Contato de Emergência">
                <textarea id="editAllergies" placeholder="Alergias"></textarea>
                <textarea id="editMedications" placeholder="Medicamentos em Uso"></textarea>
                <textarea id="editNotes" placeholder="Observações"></textarea>
              </div>
              <button type="submit" class="btn-primary full-width">Atualizar Paciente</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Hidden sections for update/delete (keeping original functionality) -->
      <div style="display: none;">
        <input type="text" id="patientIdInput">
        <button id="getPatientByIdBtn">Buscar por ID</button>
        <input type="text" id="updateId">
        <input type="text" id="updateName">
        <input type="text" id="updateEmail">
        <input type="text" id="updatePhone">
        <button id="updatePatientBtn">Atualizar</button>
        <input type="text" id="deleteId">
        <button id="deletePatientBtn">Deletar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
